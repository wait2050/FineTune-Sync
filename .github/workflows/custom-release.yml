name: Release FineTune Sync

on:
  push:
    tags: ['cn-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing custom release tag, for example cn-v1.9.0-r1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: FineTune-CN-macOS
          path: release
      - name: Publish only the tested custom build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in cn-v*) ;; *) echo 'Expected a cn-v custom tag'; exit 1 ;; esac
          cp RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          (cd release && sha256sum FineTune-Delay-macOS.zip > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/FineTune-Delay-macOS.zip release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" release/FineTune-Delay-macOS.zip release/SHA256SUMS \
              --verify-tag --title "FineTune Sync $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
